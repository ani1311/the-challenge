services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: challenge
      POSTGRES_USER: challenge
      POSTGRES_PASSWORD: challenge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U challenge -d challenge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: containers/server.Containerfile
    environment:
      DATABASE_URL: postgres://challenge:challenge@db:5432/challenge
      RUST_LOG: info
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: containers/frontend.Containerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
